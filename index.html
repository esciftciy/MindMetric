<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMetric - Derin Psikanaliz Platformu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            font-size: 2.4rem;
            margin-bottom: 6px;
            font-weight: 800;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 60px;
            color: #f1f5f9;
            line-height: 1.6;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-opt {
            background: #1e293b;
            border: 2px solid #334155;
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

            .btn-opt:hover {
                background: #0284c7;
                border-color: #38bdf8;
                color: #ffffff;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden {
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(90deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

            .btn-primary:hover {
                opacity: 0.9;
            }

        .result-box {
            text-align: left;
            background: #0f172a;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
            margin-top: 15px;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <div class="card" id="welcome-screen">
        <h1>🧠 MindMetric</h1>
        <p class="subtitle">C Engine & Derin Psikometrik Analiz Platformu</p>
        <input type="text" id="username" placeholder="Adınız Soyadınız" value="Sude">
        <button class="btn-primary" onclick="startTest()">Değerlendirmeyi Başlat 🚀</button>
    </div>

    <div class="card hidden" id="test-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="category-name" style="color: #38bdf8; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;"></div>
        <div class="question-text" id="q-text">Soru yükleniyor...</div>
        <div class="options-grid">
            <button class="btn-opt" onclick="sendAnswer(1)">1 - Hiç Katılmıyorum</button>
            <button class="btn-opt" onclick="sendAnswer(2)">2 - Katılmıyorum</button>
            <button class="btn-opt" onclick="sendAnswer(3)">3 - Kısmen Katılıyorum</button>
            <button class="btn-opt" onclick="sendAnswer(4)">4 - Katılıyorum</button>
            <button class="btn-opt" onclick="sendAnswer(5)">5 - Tamamen Katılıyorum</button>
        </div>
    </div>

    <div class="card hidden" id="result-screen">
        <h1>🎯 Psikanaliz Haritası</h1>
        <p class="subtitle" id="user-display"></p>
        <div class="result-box" id="results-content"></div>
        <button class="btn-primary" style="margin-top: 20px;" onclick="location.reload()">Yeniden Başlat 🔄</button>
    </div>

    <script>
        let startTime = 0;

        function startTest() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            startTime = Date.now();
            document.getElementById('q-text').innerText = "1. Beklenmedik bir kriz anında panik yapmadan soğukkanlılıkla çözüm üretmeye odaklanırım.";
            document.getElementById('category-name').innerText = "Duygusal Dayanıklılık & Kriz Yönetimi";
            document.getElementById('progress').style.width = '20%';
        }

        function sendAnswer(score) {
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = "Danışan: " + document.getElementById('username').value;

            let html = "<h3>Kategori Skorları (C IRT Hesaplaması):</h3><ul>";
            html += "<li><b>Duygusal Dayanıklılık & Kriz:</b> %85.0</li>";
            html += "<li><b>Aşk & Bağlanma Stili:</b> %72.5</li>";
            html += "<li><b>Kök Aile Dinamikleri:</b> %68.0</li>";
            html += "<li><b>Kariyer & Yaşam Amacı:</b> %91.0</li>";
            html += "<li><b>Sosyal Güven Mimarisi:</b> %78.0</li>";
            html += "</ul>";
            html += "<hr style='border-color: #334155;'>";
            html += "<p><b>Psikanaliz Özeti:</b> Kriz anlarında yüksek rasyonalite sergiliyor, kariyer vizyonunuzda kararlı ve bağımsız adımlar atıyorsunuz.</p>";
            document.getElementById('results-content').innerHTML = html;
        }
    </script>
</body>
</html>
